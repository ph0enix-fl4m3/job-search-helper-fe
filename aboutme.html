<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Skill Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: linear-gradient(135deg, #f3f4f6, #e0e7ff);
      }

      .active-tab {
        background-color: #4f46e5;
        color: white;
      }
    </style>
  </head>

  <body class="font-sans text-gray-800 min-h-screen flex flex-col">
    <!-- Header -->

    <!-- Main Content -->
    <main>
      <form class="space-y-10">
        <!-- Skills -->
        <section>
          <h2 class="text-xl font-semibold text-indigo-700 mb-4">Skills</h2>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Technical Skills</label
            >
            <textarea
              rows="3"
              placeholder="e.g., Python, C++, Data Analysis"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-300 focus:outline-none resize-none"
            ></textarea>
          </div>

          <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Soft Skills</label
            >
            <textarea
              rows="3"
              placeholder="e.g., Communication, Teamwork, Critical Thinking"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-300 focus:outline-none resize-none"
            ></textarea>
          </div>
        </section>

        <!-- Preferences -->
        <section>
          <h2 class="text-xl font-semibold text-indigo-700 mb-4">
            Job Preferences
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Desired Role</label
              >
              <input
                type="text"
                placeholder="e.g., Frontend Developer"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-300 focus:outline-none"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Preferred Industry</label
              >
              <input
                type="text"
                placeholder="e.g., Healthcare, Education"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-300 focus:outline-none"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Work Preference</label
              >
              <select
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-300 focus:outline-none"
              >
                <option>Select option</option>
                <option>Remote</option>
                <option>On-site</option>
                <option>Hybrid</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Career Goals</label
              >
              <input
                type="text"
                placeholder="e.g., Become a lead data scientist"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-300 focus:outline-none"
              />
            </div>
          </div>
        </section>
      </form>
    </main>
  </body>
</html>
